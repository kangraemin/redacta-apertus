<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="960" height="430" fill="#fff"/>
  <!-- court network boundary -->
  <rect x="20" y="20" width="920" height="390" rx="10" fill="#f6f8fb" stroke="#7a8aa6" stroke-dasharray="6 4"/>
  <text x="36" y="44" font-size="14" fill="#44536b" font-weight="bold">Court network (Docker network "court", internal: no route to the internet)</text>

  <!-- clerk -->
  <rect x="44" y="160" width="130" height="80" rx="8" fill="#fff" stroke="#333"/>
  <text x="109" y="193" font-size="15" text-anchor="middle" font-weight="bold">Clerk</text>
  <text x="109" y="214" font-size="12" text-anchor="middle">browser,</text>
  <text x="109" y="229" font-size="12" text-anchor="middle">localhost:8000</text>

  <!-- app -->
  <rect x="230" y="70" width="400" height="320" rx="8" fill="#fff" stroke="#333"/>
  <text x="430" y="95" font-size="15" text-anchor="middle" font-weight="bold">app container (Python stdlib only)</text>
  <rect x="250" y="110" width="170" height="58" rx="6" fill="#eef3fb" stroke="#5b7bb2"/>
  <text x="335" y="134" font-size="13" text-anchor="middle">1. Apertus pass</text>
  <text x="335" y="152" font-size="11" text-anchor="middle">names + role, per 1,800 chars</text>
  <rect x="440" y="110" width="170" height="58" rx="6" fill="#eef3fb" stroke="#5b7bb2"/>
  <text x="525" y="134" font-size="13" text-anchor="middle">2. Checks</text>
  <text x="525" y="152" font-size="11" text-anchor="middle">copied text only, title veto</text>
  <rect x="250" y="184" width="170" height="58" rx="6" fill="#eef3fb" stroke="#5b7bb2"/>
  <text x="335" y="208" font-size="13" text-anchor="middle">3. Rules</text>
  <text x="335" y="226" font-size="11" text-anchor="middle">IBAN, AHV, phone, birth date…</text>
  <rect x="440" y="184" width="170" height="58" rx="6" fill="#eef3fb" stroke="#5b7bb2"/>
  <text x="525" y="208" font-size="13" text-anchor="middle">4. Every mention</text>
  <text x="525" y="226" font-size="11" text-anchor="middle">surname forms, letters A., B.</text>
  <rect x="250" y="258" width="360" height="58" rx="6" fill="#fff5e6" stroke="#c98a1e"/>
  <text x="430" y="282" font-size="13" text-anchor="middle">5. Review screen: redact / keep / check, with the reason</text>
  <text x="430" y="300" font-size="11" text-anchor="middle">export is blocked until every "check" item is decided</text>
  <rect x="250" y="332" width="360" height="44" rx="6" fill="#eaf6ec" stroke="#3f8f4f"/>
  <text x="430" y="359" font-size="13" text-anchor="middle">outputs/: anonymised text + audit.jsonl (who changed what)</text>

  <!-- apertus -->
  <rect x="690" y="110" width="220" height="132" rx="8" fill="#fff" stroke="#333"/>
  <text x="800" y="138" font-size="15" text-anchor="middle" font-weight="bold">apertus container</text>
  <text x="800" y="162" font-size="12" text-anchor="middle">llama.cpp server</text>
  <text x="800" y="180" font-size="12" text-anchor="middle">Apertus v1.5 8B, GGUF Q4_K_M</text>
  <text x="800" y="198" font-size="12" text-anchor="middle">5 GB, CPU or GPU</text>
  <text x="800" y="222" font-size="11" text-anchor="middle" fill="#555">or any Apertus endpoint (LLM_BASE_URL)</text>
  <rect x="690" y="270" width="220" height="74" rx="8" fill="#fff" stroke="#999" stroke-dasharray="4 3"/>
  <text x="800" y="296" font-size="12" text-anchor="middle">./models (read-only)</text>
  <text x="800" y="314" font-size="11" text-anchor="middle" fill="#555">weights copied in once,</text>
  <text x="800" y="330" font-size="11" text-anchor="middle" fill="#555">at build time</text>

  <line x1="174" y1="200" x2="228" y2="200" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="228" y1="215" x2="176" y2="215" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="420" y1="139" x2="438" y2="139" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="610" y1="139" x2="688" y2="139" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="649" y="131" font-size="10" text-anchor="middle">step 1, HTTP</text>
  <line x1="800" y1="270" x2="800" y2="244" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
</svg>
